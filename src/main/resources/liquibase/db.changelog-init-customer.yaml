databaseChangeLog:
  - changeSet:
      id: lab-3
      author: fetis_off
      changes:
        # Create sequence for Customer ID
        - createSequence:
            sequenceName: customer_id_seq
            incrementBy: 50

        - createTable:
            tableName: customer
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: customer_reference
                  type: UUID
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: customer
            columnNames: email
            constraintName: uq_customer_email

        - addUniqueConstraint:
            tableName: customer
            columnNames: customer_reference
            constraintName: uq_customer_reference
