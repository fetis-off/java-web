databaseChangeLog:
  - changeSet:
      id: lab-3
      author: fetis_off
      changes:
        # Create sequence for Product ID
        - createSequence:
            sequenceName: product_id_seq
            incrementBy: 50

        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: price
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: product
            columnNames: category_id, name
            constraintName: uq_product_category_name

        - addForeignKeyConstraint:
            baseTableName: product
            baseColumnNames: category_id
            referencedTableName: category
            referencedColumnNames: id
            constraintName: fk_products_category

        - createIndex:
            indexName: idx_product_name
            tableName: product
            columns:
              - column:
                  name: name


